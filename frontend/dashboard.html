<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management — Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="page-dashboard">

<nav>
    <div class="logo">
        <span>S</span>
        School Management
    </div>
    <div class="nav-links">
        <a href="/">Étudiants</a>
        <a href="/dashboard" class="active">Dashboard</a>
    </div>
</nav>

<div class="container">

    <div class="page-header">
        <div class="page-header-left">
            <h1>Tableau de bord</h1>
            <p>Statistiques et indicateurs de performance académique</p>
        </div>
    </div>

    <div id="kpi-container" class="kpi-grid">
        <div class="loading kpi-loading">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-card">
            <h3>Étudiants par classe</h3>
            <div class="chart-body"><canvas id="chartClasses"></canvas></div>
        </div>
        <div class="chart-card">
            <h3>Répartition par source</h3>
            <div class="chart-body"><canvas id="chartSources"></canvas></div>
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-card">
            <h3>Valides vs invalides</h3>
            <div class="chart-body"><canvas id="chartValidite"></canvas></div>
        </div>
        <div class="chart-card">
            <h3>Moyenne générale par classe</h3>
            <div class="chart-body"><canvas id="chartMoyennes"></canvas></div>
        </div>
    </div>

    <div class="chart-card">
        <h3>Top 10 — meilleures moyennes</h3>
        <div class="chart-body chart-body-tall"><canvas id="chartTop10"></canvas></div>
    </div>

</div>

<footer class="site-footer">
    <div class="footer-text">Développé par <strong>Ndeye Penda Sarr</strong> — 2026</div>
    <div class="footer-socials">
        <a href="https://www.linkedin.com/in/ndeyependasarr" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin-in"></i>
        </a>
        <a href="https://github.com/NdeyePendaSarr" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
        </a>
    </div>
</footer>

<script src="/static/js/dashboard.js"></script>
</body>
</html>
